database:
  path: data/cybertwin.db

detection:
  thresholds:
    low: 0.30
    medium: 0.60
    high: 0.80
  baseline_window_minutes: 5

devices:
  - device_id: camera-01
    name: Smart Camera
    device_type: smart_camera
    source_ip: 10.20.0.10
    expected_destinations:
      - camera-cloud.local
      - dns.local
      - ntp.local
    expected_protocols: [DNS, HTTPS, NTP]
    normal_connections_per_minute: [3, 8]
    normal_bytes_per_minute: [25000, 65000]

  - device_id: smart-plug-01
    name: Smart Plug
    device_type: smart_plug
    source_ip: 10.20.0.11
    expected_destinations:
      - mqtt.local
      - dns.local
      - ntp.local
    expected_protocols: [DNS, MQTT, NTP]
    normal_connections_per_minute: [1, 4]
    normal_bytes_per_minute: [500, 5000]

  - device_id: temperature-sensor-01
    name: Temperature Sensor
    device_type: temperature_sensor
    source_ip: 10.20.0.12
    expected_destinations:
      - mqtt.local
      - dns.local
      - ntp.local
    expected_protocols: [DNS, MQTT, NTP]
    normal_connections_per_minute: [1, 3]
    normal_bytes_per_minute: [200, 2500]

  - device_id: edge-gateway-01
    name: Edge Gateway
    device_type: edge_gateway
    source_ip: 10.20.0.2
    expected_destinations:
      - dns.local
      - mqtt.local
      - ntp.local
    expected_protocols: [DNS, MQTT, NTP, HTTPS]
    normal_connections_per_minute: [4, 15]
    normal_bytes_per_minute: [5000, 100000]

